<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | SmartAttendance</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            color: #f8fafc;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(59,130,246,0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(99,102,241,0.10),
                    transparent 30%
                ),
                #080c14;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        .container {
            width: 100%;
            max-width: 460px;
        }


        /* CARD */

        .card {
            width: 100%;

            padding: 32px;

            background: rgba(17,24,39,0.92);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 22px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.35);
        }


        /* HEADER */

        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 25px;

            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;

            font-size: 13px;

            line-height: 1.5;
        }


        /* FORM */

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;

            color: #cbd5e1;

            font-size: 12px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .password-box {
            position: relative;
        }


        .password-box input {
            width: 100%;

            padding: 13px 45px 13px 14px;

            color: #f8fafc;

            background: rgba(255,255,255,0.045);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 12px;

            outline: none;

            font-size: 13px;

            transition: 0.2s ease;
        }


        .password-box input:focus {
            border-color: rgba(59,130,246,0.65);

            background: rgba(59,130,246,0.04);

            box-shadow:
                0 0 0 3px rgba(59,130,246,0.08);
        }


        .password-box input::placeholder {
            color: #64748b;
        }


        /* EYE BUTTON */

        .eye {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;

            background: transparent;

            color: #94a3b8;

            cursor: pointer;

            border-radius: 8px;

            font-size: 16px;
        }

        .eye:hover {
            background: rgba(255,255,255,0.06);

            color: white;
        }


        /* BUTTONS */

        .buttons {
            display: flex;

            gap: 10px;

            margin-top: 24px;
        }


        .btn {
            flex: 1;

            padding: 13px;

            border-radius: 12px;

            font-size: 13px;

            font-weight: 700;

            text-align: center;

            text-decoration: none;

            cursor: pointer;
        }


        .cancel {
            color: #cbd5e1;

            background: rgba(255,255,255,0.045);

            border: 1px solid rgba(255,255,255,0.08);
        }


        .cancel:hover {
            background: rgba(255,255,255,0.08);
        }


        .save {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            border: none;

            box-shadow:
                0 8px 25px rgba(37,99,235,0.20);
        }


        .save:hover {
            transform: translateY(-1px);

            box-shadow:
                0 12px 30px rgba(37,99,235,0.28);
        }


        /* MESSAGES */

        .error {
            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 11px;

            color: #fca5a5;

            background: rgba(239,68,68,0.08);

            border: 1px solid rgba(239,68,68,0.16);

            font-size: 12px;

            line-height: 1.5;
        }


        .success {
            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 11px;

            color: #86efac;

            background: rgba(34,197,94,0.08);

            border: 1px solid rgba(34,197,94,0.16);

            font-size: 12px;

            line-height: 1.5;
        }


        /* MOBILE */

        @media (max-width: 500px) {

            body {
                padding: 14px;
            }

            .card {
                padding: 23px 18px;

                border-radius: 18px;
            }

            .header h1 {
                font-size: 22px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

    </style>
</head>


<body>

<div class="container">

    <div class="card">

        <div class="header">

            <h1>
                Change Password
            </h1>

            <p>
                Update your SmartAttendance account password.
            </p>

        </div>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        {% if success %}

        <div class="success">
            {{ success }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('change_password') }}"
        >


            <!-- CURRENT PASSWORD -->

            <div class="field">

                <label for="current_password">
                    Current Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="current_password"
                        name="current_password"
                        placeholder="Enter current password"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword('current_password', this)"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- NEW PASSWORD -->

            <div class="field">

                <label for="new_password">
                    New Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="new_password"
                        name="new_password"
                        placeholder="Enter new password"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword('new_password', this)"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="field">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword('confirm_password', this)"
                    >
                        👁
                    </button>

                </div>

            </div>


            <div class="buttons">

                <a
                    href="{{ url_for('profile') }}"
                    class="btn cancel"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn save"
                >
                    Change Password
                </button>

            </div>


        </form>

    </div>

</div>


<script>

function togglePassword(id, button) {

    const input = document.getElementById(id);

    if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

    } else {

        input.type = "password";

        button.textContent = "👁";

    }

}

</script>

</body>

</html>
